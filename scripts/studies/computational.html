<!doctype html>
<!--
  Visual study 02 — Computational Forms. Rendered by scripts/render-studies.mjs.
  A curtain of point columns with undulating edges and sparse signal columns,
  after the brand kit study, drawn at print resolution with the site palette.
-->
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #0b0f14; }
  canvas { display: block; }
</style>
<canvas id="c"></canvas>
<script>
  const W = 3200;
  const H = 2000;
  const canvas = document.getElementById("c");
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  const ctx = canvas.getContext("2d");

  // Deterministic noise so every render is identical.
  const rand = (seed) => {
    const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  };

  ctx.fillStyle = "#0b0f14";
  ctx.fillRect(0, 0, W, H);

  // Faint horizontal measure lines, as in the original study.
  ctx.strokeStyle = "rgba(242,241,237,0.035)";
  ctx.lineWidth = 2;
  for (let y = 280; y < H; y += 160) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  const COLS = 190;
  const ROWS = 96;
  const left = W * 0.07;
  const right = W * 0.985;

  for (let c = 0; c < COLS; c++) {
    const u = c / (COLS - 1);
    // Perspective: columns crowd and shrink as they recede to the right.
    const depth = 1 - 0.38 * Math.pow(u, 1.3);
    const x = left + (right - left) * (1 - Math.pow(1 - u, 1.18));
    const top =
      H * 0.5 -
      H * 0.27 * depth -
      H * 0.11 * Math.sin(u * 5.2 + 0.4) -
      H * 0.05 * Math.sin(u * 13.1 + 1.7);
    const bottom =
      H * 0.5 +
      H * 0.24 * depth +
      H * 0.08 * Math.sin(u * 4.1 + 2.3) +
      H * 0.035 * Math.sin(u * 11.7 + 0.2);
    const signal = rand(c * 3.7) > 0.935;
    // Light falls hardest across the centre-left of the field.
    const light = 0.18 + 0.82 * Math.exp(-Math.pow((u - 0.38) / 0.27, 2));

    for (let r = 0; r < ROWS; r++) {
      const v = r / (ROWS - 1);
      const jitter = (rand(c * 911 + r * 7.3) - 0.5) * 2.2;
      const y = top + (bottom - top) * v + jitter;
      const edge = Math.min(1, v / 0.1, (1 - v) / 0.1);
      const ripple = 0.72 + 0.28 * Math.sin(v * 9 + u * 21);
      let alpha = light * ripple * (0.35 + 0.65 * edge) * (0.78 + 0.22 * rand(c * 13 + r));
      const radius = (3.1 + 1.4 * light) * depth;
      if (signal) {
        ctx.fillStyle = `rgba(183,255,99,${Math.min(1, alpha * 1.15)})`;
      } else {
        ctx.fillStyle = `rgba(242,241,237,${Math.min(1, alpha)})`;
      }
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Soft vignette so the field sits inside the page rather than on it.
  const g = ctx.createRadialGradient(W * 0.45, H * 0.5, H * 0.35, W * 0.5, H * 0.5, W * 0.62);
  g.addColorStop(0, "rgba(11,15,20,0)");
  g.addColorStop(1, "rgba(11,15,20,0.75)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  window.__done = true;
</script>
